name: ProductPulse CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: productpulse
          POSTGRES_PASSWORD: replace_me
          POSTGRES_DB: productpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U productpulse -d productpulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://productpulse:replace_me@localhost:5432/productpulse_test
      TEST_DATABASE_URL: postgresql+psycopg://productpulse:replace_me@localhost:5432/productpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: ruff check --config backend/pyproject.toml backend scripts
      - run: ruff format --check --config backend/pyproject.toml backend scripts
      - run: alembic upgrade head && alembic check
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=95
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
