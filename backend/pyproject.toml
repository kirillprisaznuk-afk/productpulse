[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "productpulse"
version = "0.1.0"
description = "Synthetic product analytics and experimentation foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.118.0", "pydantic==2.11.9", "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.10", "alembic==1.16.5", "uvicorn==0.37.0",
  "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "ruff==0.13.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
