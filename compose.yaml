services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-productpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-productpulse_local}
      POSTGRES_DB: ${POSTGRES_DB:-productpulse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment: &database_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-productpulse}:${POSTGRES_PASSWORD:-productpulse_local}@db:5432/${POSTGRES_DB:-productpulse}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: ./backend
    environment: *database_environment
    command: ["python", "-m", "app.seed", "--seed", "42", "--if-empty"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: ./backend
    environment: *database_environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
volumes:
  postgres_data:
