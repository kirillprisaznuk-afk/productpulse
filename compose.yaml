name: productpulse-local
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-productpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-productpulse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment: &database_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-productpulse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-productpulse}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  seed:
    build: ./backend
    environment: *database_environment
    command: ["python", "-m", "app.seed", "--seed", "42", "--if-empty"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: ./backend
    environment: *database_environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    environment:
      PRODUCTPULSE_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/methodology').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
